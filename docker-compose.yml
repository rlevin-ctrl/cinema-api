services:
  postgres:
    image: postgres:16-alpine
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cinema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinema}
      POSTGRES_DB: ${DB_NAME:-cinema}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cinema-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cinema} -d ${DB_NAME:-cinema}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinema-pgdata:
